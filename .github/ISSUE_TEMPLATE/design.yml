name: Design Task
description: Plan or implement a UI/UX design change
title: '[Design] '
labels: ['type: design']
body:
  - type: textarea
    id: overview
    attributes:
      label: 작업 개요
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적 및 사용자 문제
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 상세 요구사항
      description: 레이아웃, 상태, 인터랙션, 반응형 조건
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 구현 체크리스트
      options:
        - label: 키보드 및 접근성 동작을 고려했습니다.
        - label: 좁은 화면 동작을 고려했습니다.
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: 테스트 및 검증 방법
      description: 자동화 테스트 또는 브라우저 확인 절차
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
