name: Refactoring
description: Improve internal structure without changing intended behavior
title: '[Refactor] '
labels: ['type: refactor']
body:
  - type: textarea
    id: overview
    attributes:
      label: 작업 개요
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적 및 현재 문제
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 상세 요구사항 및 영향 범위
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 구현 체크리스트
      options:
        - label: 기존 동작을 유지합니다.
          required: true
        - label: 영향을 받는 모듈을 확인했습니다.
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: 테스트 및 검증 방법
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
